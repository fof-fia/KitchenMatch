<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchen Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #FAF9F6; height: 100dvh; margin: 0; overflow: hidden; }
        .recipe-card { border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; pointer-events: none; }
        #debug-log { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); color: #00ff00; font-family: monospace; font-size: 10px; padding: 8px; height: 80px; overflow-y: auto; z-index: 10000; pointer-events: none; border-top: 1px solid #333; }
        button { cursor: pointer; z-index: 1000; position: relative; }
    </style>
</head>
<body class="flex flex-col items-center">

    <div id="debug-log">System initializing...</div>

    <!-- LOGIN SCREEN -->
    <div id="user-setup" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center p-10 text-center">
        <h2 class="text-3xl font-bold mb-2 text-gray-700">Kitchen Match ✨</h2>
        <p class="text-gray-400 mb-8">Who is cooking today?</p>
        <div class="flex flex-col gap-4 w-full max-w-[200px]">
            <button onclick="setUser('Sofia')" class="p-5 bg-blue-50 rounded-2xl border-2 border-blue-100 font-bold text-gray-700 shadow-sm active:bg-blue-200">Sofia 🌸</button>
            <button onclick="setUser('Sebastian')" class="p-5 bg-blue-50 rounded-2xl border-2 border-blue-100 font-bold text-gray-700 shadow-sm active:bg-blue-200">Sebastian 🌿</button>
        </div>
    </div>

    <header class="w-full p-4 text-center">
        <h1 class="text-xl font-bold text-gray-700">Kitchen Match</h1>
        <p id="user-display" class="text-[10px] text-blue-300 uppercase font-bold tracking-widest"></p>
    </header>

    <!-- MAIN APP SCREEN -->
    <div id="screen-swipe" class="w-full flex flex-col items-center">
        <div id="cardStack" class="relative h-[50vh] w-[85vw] max-w-[350px] flex items-center justify-center border-2 border-dashed border-gray-100 rounded-[30px]">
             <div class="text-center p-10 text-gray-300 italic">Connecting to recipes...</div>
        </div>
        <div class="flex gap-12 mt-12">
            <button onclick="handleSwipe('left')" class="w-20 h-20 rounded-full bg-white shadow-xl text-pink-300 text-3xl border border-pink-50 flex items-center justify-center">✕</button>
            <button onclick="handleSwipe('right')" class="w-20 h-20 rounded-full bg-blue-100 shadow-xl text-blue-400 text-3xl flex items-center justify-center">♥</button>
        </div>
    </div>

    <script>
        // 1. Move LOG function to the very top so it's defined immediately
        function log(msg) {
            const el = document.getElementById('debug-log');
            if (el) {
                el.innerHTML += "<br>> " + msg;
                el.scrollTop = el.scrollHeight;
            }
            console.log(msg);
        }

        // 2. CONFIG - Using the names exactly as the browser likes them
        const SPOON_KEY = 'f639ea2bdf674453953de8b6780c9a88';
        const SUB_URL = 'https://eqkutvtvnytjxcefdujb.supabase.co';
        const SUB_KEY = 'sb_publishable_7Onm8kFJz2qlo7Bsp8uZkA_yPT0hPaW'; 

        let databaseClient; // Renamed from 'supabase' to avoid collision
        let currentUser = "";
        let recipes = [];
        let currentIndex = 0;

        // Initialize Database
        try {
            databaseClient = window.supabase.createClient(SUB_URL, SUB_KEY);
            log("Database connection ready.");
        } catch(e) {
            log("DB ERROR: " + e.message);
        }

        function setUser(name) {
            log("User selected: " + name);
            currentUser = name;
            document.getElementById('user-setup').style.display = 'none';
            document.getElementById('user-display').innerText = "Chef: " + name;
            fetchRecipes();
        }

        async function fetchRecipes() {
            log("Fetching vegetarian recipes...");
            try {
                const res = await fetch(`https://api.spoonacular.com/recipes/complexSearch?diet=vegetarian&number=30&apiKey=${SPOON_KEY}`);
                const data = await res.json();
                if (data.results) {
                    recipes = data.results;
                    log("Success! " + recipes.length + " recipes loaded.");
                    renderCard();
                } else {
                    log("API returned no recipes. Check key.");
                }
            } catch (e) {
                log("FETCH ERROR: " + e.message);
            }
        }

        function renderCard() {
            const container = document.getElementById('cardStack');
            if (!recipes[currentIndex]) {
                container.innerHTML = `<div class='p-10 text-center text-gray-400'>All recipes seen!</div>`;
                return;
            }
            const r = recipes[currentIndex];
            container.innerHTML = `
                <div class="recipe-card bg-white h-full w-full overflow-hidden flex flex-col border border-blue-50" id="currentCard">
                    <img src="${r.image}" class="w-full h-3/4 object-cover">
                    <div class="p-5">
                        <h3 class="font-bold text-lg text-gray-700 leading-tight">${r.title}</h3>
                    </div>
                </div>`;
        }

        async function handleSwipe(dir) {
            const recipe = recipes[currentIndex];
            const card = document.getElementById('currentCard');
            if (!card) return;

            log("Swiped " + dir + " on " + recipe.title);
            card.style.transform = dir === 'right' ? 'translateX(150%) rotate(20deg)' : 'translateX(-150%) rotate(-20deg)';
            card.style.opacity = '0';

            // Background save
            if (databaseClient) {
                databaseClient.from('swipes').insert([
                    { 
                        recipe_id: recipe.id.toString(), 
                        user_name: currentUser, 
                        choice: dir === 'right' ? 'like' : 'dislike', 
                        recipe_title: recipe.title, 
                        recipe_image: recipe.image 
                    }
                ]).then(({ error }) => {
                    if (error) log("DB SAVE ERROR: " + error.message);
                    else log("Swipe saved to DB.");
                });
            }

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 300);
        }
    </script>
</body>
</html>
